<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Productos{% endblock %} · Tienda</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; color: #1f2937; background: #f3f4f6; }
        main { max-width: 900px; margin: 2rem auto; padding: 1.5rem; background: white; border-radius: .5rem; }
        h1 { margin-top: 0; }
        a { color: #1d4ed8; }
        .boton, button { display: inline-block; background: #1d4ed8; color: white; padding: .7rem 1rem; border: 0; border-radius: .3rem; text-decoration: none; font: inherit; cursor: pointer; }
        .tabla { overflow-x: auto; margin-top: 1.5rem; }
        table { border-collapse: collapse; width: 100%; }
        th, td { text-align: left; padding: .8rem; border-bottom: 1px solid #d1d5db; }
        th { background: #f3f4f6; }
        .campo { margin-bottom: 1.2rem; }
        label { display: block; font-weight: 600; margin-bottom: .4rem; }
        input { box-sizing: border-box; width: 100%; max-width: 30rem; padding: .6rem; border: 1px solid #6b7280; border-radius: .3rem; font: inherit; }
        .errorlist { color: #991b1b; }
        .acciones { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; }
        @media (max-width: 600px) { main { margin: .5rem; padding: 1rem; } }
    </style>
</head>
<body>
    <main>
        <h1>Tienda · Gestión de productos</h1>
        {% block contenido %}{% endblock %}
    </main>
</body>
</html>
